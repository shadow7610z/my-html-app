<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Pocket Player</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&display=swap">
<style>
@property --c1{syntax:'<color>';inherits:true;initial-value:#4B5BFF}
@property --c2{syntax:'<color>';inherits:true;initial-value:#B13CFF}
@property --c3{syntax:'<color>';inherits:true;initial-value:#1FB7C9}
:root{color-scheme:dark;--ink:#fff;--muted:rgba(255,255,255,.7);--p:0;
transition:--c1 1.3s ease,--c2 1.3s ease,--c3 1.3s ease;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{overflow-x:hidden}
body{margin:0;background:#080A10;color:var(--ink);font:400 16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
.bg{position:fixed;inset:-25%;z-index:-1;pointer-events:none;
background:radial-gradient(38% 34% at 22% 24%,var(--c1),transparent 72%),radial-gradient(42% 38% at 80% 32%,var(--c2),transparent 72%),radial-gradient(48% 42% at 48% 86%,var(--c3),transparent 72%),#080A10;
animation:drift 20s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(5%,4%) rotate(7deg) scale(1.1)}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:12px}
.app{max-width:480px;margin:0 auto;padding:22px 18px 36px;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}

.glass{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.16);
background:linear-gradient(135deg,rgba(255,255,255,.27),rgba(255,255,255,.06));
-webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);
box-shadow:inset 0 1px 1px rgba(255,255,255,.6),inset 0 -1px 1px rgba(255,255,255,.12),inset 0 0 24px rgba(255,255,255,.07),0 14px 34px -12px rgba(0,0,0,.5)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .4s;
background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.6),transparent 58%)}
.btn{transition:transform .5s cubic-bezier(.34,1.7,.64,1),background .3s}
.btn.touch{transform:scale(.92);transition-duration:.12s}
.btn.touch::after,.panel.touch::after{opacity:1;transition-duration:.1s}

.artwrap{display:grid;place-items:center;padding-top:6px}

.art{position:relative;width:min(80vw,340px);aspect-ratio:1;border-radius:36px;overflow:hidden;
background:linear-gradient(145deg,var(--c1),var(--c2) 60%,var(--c3));
box-shadow:0 36px 60px -24px color-mix(in srgb,var(--c1) 75%,#000),0 0 0 1px rgba(255,255,255,.14);
}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art img[hidden]{display:none}
.art{cursor:pointer}
.art svg{position:absolute;left:30%;top:22%;width:40%;height:40%;color:rgba(255,255,255,.75)}
.art .hint{position:absolute;left:0;right:0;bottom:17%;text-align:center;font-size:.9rem;font-weight:600;color:rgba(255,255,255,.85)}
.art.has svg,.art.has .hint{display:none}
.art::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
box-shadow:inset 0 1px 2px rgba(255,255,255,.55),inset 0 -1px 2px rgba(255,255,255,.15);
background:linear-gradient(160deg,rgba(255,255,255,.22),transparent 40%)}

.now{min-width:0;text-align:center}
.now h1{margin:0;font-size:1.6rem;font-weight:800;line-height:1.25;overflow:hidden;white-space:nowrap}
#title{display:inline-block;white-space:nowrap}
#title .cp{display:inline-block;padding-right:56px}
#title.slide{animation:mq var(--d,10s) linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.now p{margin:2px 0 0;color:var(--muted);font-size:.95rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

.seek{display:grid;gap:4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;margin:0;background:none;--v:0%}
input[type=range]::-webkit-slider-runnable-track{height:9px;border-radius:5px;border:1px solid rgba(255,255,255,.14);
background:linear-gradient(90deg,rgba(255,255,255,.92) var(--v),rgba(255,255,255,.2) var(--v))}
input[type=range]::-moz-range-track{height:9px;border-radius:5px;background:rgba(255,255,255,.2)}
input[type=range]::-moz-range-progress{height:9px;border-radius:5px;background:rgba(255,255,255,.92)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-9px;border-radius:50%;border:0;
background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.4),inset 0 -2px 4px rgba(0,0,0,.12)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;border:0;background:#fff}
.times{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.seekbox{position:relative;height:34px}
.seekbox canvas{position:absolute;inset:0;width:100%;height:100%}
.seekbox input{position:absolute;inset:0;height:100%;opacity:0;cursor:pointer}

.tr{display:flex;align-items:center;justify-content:center;gap:22px;padding:4px 0}
.ib{width:66px;height:66px;border-radius:50%;display:grid;place-items:center}
.ib svg{width:28px;height:28px;position:relative;z-index:1}
.go{width:112px;height:112px;
box-shadow:inset 0 1px 1px rgba(255,255,255,.7),inset 0 -1px 1px rgba(255,255,255,.15),inset 0 0 28px rgba(255,255,255,.12),0 14px 34px -12px rgba(0,0,0,.5),0 0 0 calc(var(--p)*20px) rgba(255,255,255,.2)}
.go svg{width:50px;height:50px}

.chips{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chip{min-height:54px;border-radius:999px;font-weight:600;padding:0 12px;color:var(--muted)}
.chip.on{color:#fff;background:linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,255,255,.18))}

.panel{border-radius:28px}
.ph{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 10px 20px}
.ph h2{margin:0;font-size:1.05rem;font-weight:600}
.add{border-radius:999px;padding:10px 20px;font-weight:600}
ul{list-style:none;margin:0;padding:4px 8px 8px;max-height:46vh;overflow-y:auto}
li{display:flex;align-items:center;border-radius:18px}
li.cur{background:rgba(255,255,255,.2);box-shadow:inset 0 1px 1px rgba(255,255,255,.4)}
.row{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;padding:8px 8px}
.th{flex:none;width:46px;height:46px;border-radius:12px;object-fit:cover;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li.cur .nm{font-weight:600}
li.rd .nm::after{content:" \25CF";font-size:.6em;vertical-align:middle;color:rgba(255,255,255,.85)}
li.an .nm::after{content:" \2026";color:var(--muted)}
.rm{width:44px;height:44px;display:grid;place-items:center;color:var(--muted);border-radius:50%}
.rm svg{width:16px;height:16px}
#empty{padding:12px 22px 22px;text-align:center;color:var(--muted)}
#msg{min-height:1.4em;padding:0 20px 14px;color:var(--muted);font-size:.9rem}
.drop{outline:2px dashed #fff;outline-offset:-8px}
@media (prefers-reduced-motion:reduce){.bg{animation:none}#title.slide{animation:none}#title .cp+.cp{display:none}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main class="app">
  <div class="artwrap"><div class="art" id="artbox" role="button" tabindex="0" aria-label="Album cover. Tap to choose a cover image"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3v10.6A4 4 0 1 0 14 17V7h4V3z"/></svg><span class="hint" id="hint">Tap to add songs</span><img id="art" alt="Album cover" hidden></div></div>
  <section class="now" aria-label="Now playing"><h1><span id="title">Nothing playing</span></h1><p id="sub">Add songs from this device</p></section>
  <div class="seek">
    <div class="seekbox"><canvas id="wave" aria-hidden="true"></canvas><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek"></div>
    <div class="times"><span id="tc">0:00</span><span id="td">0:00</span></div>
  </div>
  <div class="tr">
    <button class="ib glass btn" id="prev" aria-label="Previous song"></button>
    <button class="ib go glass btn" id="play" aria-label="Play"></button>
    <button class="ib glass btn" id="next" aria-label="Next song"></button>
  </div>
  <div class="chips">
    <button class="chip glass btn" id="vib"></button>
    <button class="chip glass btn" id="sens"></button>
    <button class="chip glass btn" id="shuf"></button>
    <button class="chip glass btn" id="rep"></button>
  </div>
  <section class="panel glass" aria-label="Playlist">
    <div class="ph"><h2 id="count">Playlist</h2><button class="add glass btn" id="addBtn">Add songs</button></div>
    <div id="empty">Add songs from this device, or drop audio files anywhere on this page.</div>
    <ul id="list"></ul>
    <div id="msg" role="status" aria-live="polite"></div>
  </section>
</main>
<input type="file" id="file" accept="audio/*" multiple hidden>
<input type="file" id="imgFile" accept="image/*" hidden>
<script>
const $=s=>document.querySelector(s);
const audio=new Audio();audio.preload='metadata';
const R=document.documentElement.style;
let tracks=[],cur=-1,shuffle=false,repeat=0,haptics=true,sens=1;
let vibing=false,fails=0,lastK=-1,acc=0,hold=0,prevFire=false,clkOff=0,clkOn=false,busy=false,lastTitle='';
const SENS=['Low','Mid','High'],RANGE=[9,14,20],FR=20,LEAD=35;
const P={play:'<path d="M8 5v14l11-7z"/>',pause:'<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>',prev:'<path d="M6 5h2v14H6zM20 5v14L9 12z"/>',next:'<path d="M16 5h2v14h-2zM4 5l11 7L4 19z"/>'};
const fi=k=>'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'+P[k]+'</svg>';
const xi='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';
const fmt=s=>{if(!isFinite(s))return'0:00';s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const say=t=>{$('#msg').textContent=t};
const hue=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return h};
const stat=t=>t.env===undefined?'Analysing bass\u2026':t.env===null?'Can\u2019t analyse this song':haptics?'Bass vibration ready':'Vibration off';

/* ---- artwork + tags ---- */
const u32=(b,o)=>((b[o]<<24)|(b[o+1]<<16)|(b[o+2]<<8)|b[o+3])>>>0;
const syn=(b,o)=>((b[o]&127)<<21)|((b[o+1]&127)<<14)|((b[o+2]&127)<<7)|(b[o+3]&127);
function parse(b){
  const o={},L=(s,e)=>String.fromCharCode(...b.subarray(s,e));
  if(L(0,3)==='ID3'){
    const v=b[3],end=Math.min(b.length,10+syn(b,6)),h=v===2?6:10;let p=10;
    if(b[5]&64)p+=v===4?syn(b,10):u32(b,10)+4;
    while(p+h<=end&&b[p]){
      const id=L(p,p+(v===2?3:4)),sz=v===2?((b[p+3]<<16)|(b[p+4]<<8)|b[p+5]):v===4?syn(b,p+6):u32(b,p+4);
      const s=p+h,e=Math.min(s+sz,b.length);
      if(id==='APIC'||id==='PIC'){
        for(let i=s;i<Math.min(e-4,s+300);i++)if((b[i]===255&&b[i+1]===216&&b[i+2]===255)||(b[i]===137&&b[i+1]===80&&b[i+2]===78&&b[i+3]===71)){o.img=b.slice(i,e);break}
      }else if(id==='TIT2'||id==='TT2'||id==='TPE1'||id==='TP1'){
        const str=new TextDecoder(['windows-1252','utf-16','utf-16be','utf-8'][b[s]]||'utf-8').decode(b.subarray(s+1,e)).replace(/\0+$/,'').trim();
        if(str)o[id==='TIT2'||id==='TT2'?'title':'artist']=str;
      }
      p=e;
    }
  }else if(L(0,4)==='fLaC'){
    let p=4;
    while(p<b.length-4){
      const ty=b[p]&127,last=b[p]&128,len=(b[p+1]<<16)|(b[p+2]<<8)|b[p+3];
      if(ty===6){let q=p+8;q+=4+u32(b,q);q+=4+u32(b,q)+16;const n=u32(b,q);o.img=b.slice(q+4,q+4+n);break}
      p+=4+len;if(last)break;
    }
  }else if(L(4,8)==='ftyp'){
    for(let k=0;k<b.length-12;k++)if(b[k]===99&&b[k+1]===111&&b[k+2]===118&&b[k+3]===114){const a=k+4;o.img=b.slice(a+16,a+u32(b,a));break}
  }
  return o;
}
function toHsl(r,g,b){
  r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let h=0,s=0;
  if(d){s=d/(1-Math.abs(2*l-1));h=mx===r?((g-b)/d+6)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}
  return[h,s,l];
}
function palette(im){
  const c=document.createElement('canvas');c.width=c.height=32;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,32,32);
  const d=x.getImageData(0,0,32,32).data,B=[];
  for(let i=0;i<d.length;i+=4){
    const[h,s,l]=toHsl(d[i],d[i+1],d[i+2]);
    if(l<.1||l>.93)continue;
    const w=.08+s*s*(1-Math.abs(l-.5)),k=Math.floor(h/36)%10,o=B[k]||(B[k]={w:0,r:0,g:0,b:0});
    o.w+=w;o.r+=d[i]*w;o.g+=d[i+1]*w;o.b+=d[i+2]*w;
  }
  const top=B.filter(Boolean).sort((a,b)=>b.w-a.w).slice(0,3).map(o=>toHsl(o.r/o.w,o.g/o.w,o.b/o.w));
  const h0=top.length?top[0][0]:230,out=top.map(([h,s,l])=>'hsl('+Math.round(h)+' '+Math.round(Math.max(s,.5)*100)+'% '+Math.round(Math.min(.6,Math.max(.36,l))*100)+'%)');
  for(let i=out.length;i<3;i++)out.push('hsl('+Math.round((h0+45*i)%360)+' 62% 46%)');
  return out;
}
const colorsOf=url=>new Promise(res=>{const im=new Image();im.onload=()=>{try{res(palette(im))}catch(e){res(null)}};im.onerror=()=>res(null);im.src=url});
async function readTags(t){
  try{
    const head=new Uint8Array(await t.file.slice(0,10).arrayBuffer());
    const isId3=head[0]===73&&head[1]===68&&head[2]===51;
    const o=parse(new Uint8Array(await t.file.slice(0,Math.min(t.file.size,isId3?20+syn(head,6):4e7)).arrayBuffer()));
    if(o.title)t.title=o.title;if(o.artist)t.artist=o.artist;
    if(o.img&&o.img.length>200){
      const deun=a=>{const r=[];for(let i=0;i<a.length;i++){r.push(a[i]);if(a[i]===255&&a[i+1]===0)i++}return Uint8Array.from(r)};
      for(const bytes of [o.img,deun(o.img)]){
        const url=URL.createObjectURL(new Blob([bytes],{type:bytes[0]===137?'image/png':'image/jpeg'})),cols=await colorsOf(url);
        if(cols){t.art=url;t.cols=cols;break}
        URL.revokeObjectURL(url);
      }
    }
  }catch(e){}
  if(tracks[cur]===t)theme(t);
  ui();
}
const DEF=['#4B5BFF','#B13CFF','#1FB7C9'];
function theme(t){
  const c=(t&&t.cols)||DEF;
  R.setProperty('--c1',c[0]);R.setProperty('--c2',c[1]);R.setProperty('--c3',c[2]);
  const a=$('#art');
  if(t&&t.art){a.src=t.art;a.hidden=false}else{a.hidden=true;a.removeAttribute('src')}
  $('#artbox').classList.toggle('has',!!(t&&t.art));
  $('#hint').textContent=t?'Tap to add cover':'Tap to add songs';
}

/* ---- bass analysis: one pass per song, runs in the background ---- */
async function analyse(t){
  try{
    const buf=await new OfflineAudioContext(1,1,8000).decodeAudioData(await t.file.arrayBuffer());
    const n=buf.length,oc=new OfflineAudioContext(1,n,8000),src=oc.createBufferSource();
    src.buffer=buf;
    const hp=oc.createBiquadFilter();hp.type='highpass';hp.frequency.value=25;hp.Q.value=-3.01;
    const a=oc.createBiquadFilter(),b=oc.createBiquadFilter();
    for(const f of [a,b]){f.type='lowpass';f.frequency.value=100;f.Q.value=-3.01}
    src.connect(hp);hp.connect(a);a.connect(b);b.connect(oc.destination);src.start();
    const y=(await oc.startRendering()).getChannelData(0);
    const cs=new Float64Array(n+1);for(let i=0;i<n;i++)cs[i+1]=cs[i]+y[i]*y[i];
    const m=Math.floor(n/160),db=new Float32Array(m);
    for(let k=0;k<m;k++){const s=Math.max(0,k*160-80),e=Math.min(n,k*160+240);db[k]=10*Math.log10((cs[e]-cs[s])/(e-s)+1e-12)}
    const so=Float32Array.from(db).sort();
    t.env={db,ref:Math.max(so[Math.floor(m*.95)],-40)};
  }catch(e){t.env=null}
}
async function pump(){
  if(busy)return;busy=true;
  for(;;){
    const c=tracks[cur],t=(c&&c.env===undefined)?c:tracks.find(x=>x.env===undefined);
    if(!t)break;
    await analyse(t);ui();
  }
  busy=false;
}

/* ---- vibration engine ---- */
function stopV(){prevFire=false;acc=0;if(vibing){if(navigator.vibrate)navigator.vibrate(0);vibing=false}}
function clock(){
  const now=performance.now(),off=audio.currentTime*1000-now;
  if(!clkOn||Math.abs(off-clkOff)>200){clkOff=off;clkOn=true}
  else clkOff+=(off-clkOff)*(off>clkOff?.5:.03);
  return now+clkOff;
}
function resync(){clkOn=false;lastK=-1;hold=0;stopV()}
function tick(){
  const t=tracks[cur];
  if(!t||!t.env||audio.paused||document.hidden){R.setProperty('--p',0);stopV();return}
  const k=Math.floor((clock()+LEAD)/FR);
  if(k===lastK)return;lastK=k;
  const db=t.env.db,ref=t.env.ref,rg=RANGE[sens];
  let d=0;
  if(k>=0&&k<db.length){
    d=Math.pow(Math.min(1,Math.max(0,(db[k]-(ref-rg))/rg)),1.3);
    if(k>2&&db[k]-Math.min(db[k-1],db[k-2],db[k-3])>5&&db[k]>ref-15)hold=2;
  }
  if(hold>0){d=1;hold--}
  R.setProperty('--p',d.toFixed(2));
  if(!haptics||!navigator.vibrate||d<.15){stopV();return}
  acc+=d;
  if(acc>=1){
    acc-=1;
    const ok=navigator.vibrate(prevFire?FR*2:FR);
    prevFire=true;vibing=true;
    if(!ok&&++fails===8)say('Your browser blocked vibration. Use Chrome on Android and check that vibration is on in phone settings.');
  }else prevFire=false;
}
setInterval(tick,10);

/* ---- player ---- */
function addFiles(list){
  const ok=[...list].filter(f=>f.type.startsWith('audio/')||/\.(mp3|m4a|aac|wav|flac|ogg|opus|weba)$/i.test(f.name));
  if(!ok.length){say('No audio files found. Try MP3, M4A, WAV, FLAC or OGG.');return}
  say('');
  const first=cur<0,add=ok.map(f=>({name:f.name.replace(/\.[^.]+$/,'').replace(/_/g,' '),url:URL.createObjectURL(f),file:f}));
  tracks.push(...add);
  add.forEach(readTags);
  if(first)load(0,true);else{ui();pump()}
}
function load(i,play){
  cur=i;audio.src=tracks[i].url;resync();theme(tracks[i]);
  if(play)audio.play().catch(()=>{});
  if('mediaSession' in navigator){
    const t=tracks[i],m={title:t.title||t.name,artist:t.artist||'Pocket Player'};
    if(t.art)m.artwork=[{src:t.art}];
    navigator.mediaSession.metadata=new MediaMetadata(m);
  }
  ui();pump();
}
function step(dir,auto){
  if(!tracks.length)return;
  let n;
  if(shuffle&&tracks.length>1){do{n=Math.floor(Math.random()*tracks.length)}while(n===cur)}
  else{
    n=cur+dir;
    if(n>=tracks.length){if(repeat===1||!auto)n=0;else{audio.pause();audio.currentTime=0;return}}
    if(n<0)n=tracks.length-1;
  }
  load(n,true);
}
function toggle(){
  if(cur<0){$('#file').click();return}
  audio.paused?audio.play().catch(()=>{}):audio.pause();
}
function removeAt(i){
  const playing=!audio.paused,wasCur=i===cur;
  URL.revokeObjectURL(tracks[i].url);if(tracks[i].art)URL.revokeObjectURL(tracks[i].art);
  tracks.splice(i,1);
  if(!tracks.length){cur=-1;audio.pause();audio.removeAttribute('src');audio.load();resync();theme(null);ui();prog();return}
  if(i<cur)cur--;
  else if(wasCur){load(Math.min(i,tracks.length-1),playing);return}
  ui();
}
function chips(){
  const set=(id,txt,on)=>{$(id).textContent=txt;$(id).classList.toggle('on',on)};
  set('#vib','Vibration: '+(haptics?'On':'Off'),haptics);
  set('#sens','Sensi: '+SENS[sens],true);
  set('#shuf','Shuffle: '+(shuffle?'On':'Off'),shuffle);
  set('#rep','Repeat: '+['Off','All','One'][repeat],repeat>0);
}
function setTitle(txt){
  if(txt===lastTitle)return;lastTitle=txt;
  const h=$('#title');
  h.className='';h.textContent=txt;h.style.removeProperty('--d');
  requestAnimationFrame(()=>{
    const w=h.offsetWidth;
    if(w<=h.parentElement.clientWidth+1)return;
    h.textContent='';
    for(let i=0;i<2;i++){const s=document.createElement('span');s.className='cp';s.textContent=txt;h.append(s)}
    h.style.setProperty('--d',((w+56)/45).toFixed(1)+'s');
    h.className='slide';
  });
}
function ui(){
  const t=tracks[cur];
  setTitle(t?(t.title||t.name):'Nothing playing');
  $('#sub').textContent=t?(t.artist||'Song '+(cur+1)+' of '+tracks.length)+' \u00B7 '+stat(t):'Add songs from this device';
  $('#count').textContent=tracks.length?'Playlist ('+tracks.length+')':'Playlist';
  $('#empty').hidden=tracks.length>0;
  const ul=$('#list');ul.textContent='';
  tracks.forEach((tr,i)=>{
    const li=document.createElement('li');
    li.className=(i===cur?'cur ':'')+(tr.env===undefined?'an':tr.env?'rd':'');
    const b=document.createElement('button');b.className='row';b.onclick=()=>load(i,true);
    const th=document.createElement(tr.art?'img':'span');th.className='th';
    if(tr.art){th.src=tr.art;th.alt=''}else th.style.background='linear-gradient(145deg,hsl('+hue(tr.name)+' 70% 52%),hsl('+(hue(tr.name)+60)%360+' 70% 40%))';
    const nm=document.createElement('span');nm.className='nm';nm.textContent=tr.title||tr.name;
    b.append(th,nm);
    const x=document.createElement('button');x.className='rm';x.setAttribute('aria-label','Remove '+(tr.title||tr.name));x.innerHTML=xi;x.onclick=()=>removeAt(i);
    li.append(b,x);ul.append(li);
  });
  state();
}
function state(){
  const p=!audio.paused;
  document.body.classList.toggle('playing',p);
  $('#play').innerHTML=fi(p?'pause':'play');
  $('#play').setAttribute('aria-label',p?'Pause':'Play');
}
function prog(){
  const d=audio.duration||0,t=audio.currentTime||0,v=d?t/d*1000:0;
  $('#seek').value=v;$('#seek').style.setProperty('--v',(v/10)+'%');
  $('#tc').textContent=fmt(t);$('#td').textContent=fmt(d);ct0=t;pf0=performance.now();
}
audio.ontimeupdate=audio.onloadedmetadata=audio.ondurationchange=prog;
audio.onplay=()=>{resync();state()};
audio.onpause=()=>{resync();state()};
audio.onseeked=resync;
audio.onended=()=>{if(repeat===2){audio.currentTime=0;audio.play()}else step(1,true)};
audio.onerror=()=>{if(cur<0)return;say('Can\u2019t play \u201C'+tracks[cur].name+'\u201D. Skipping to the next song.');if(tracks.length>1)step(1,true)};

$('#prev').innerHTML=fi('prev');$('#next').innerHTML=fi('next');
$('#play').onclick=toggle;
$('#next').onclick=()=>step(1,false);
$('#prev').onclick=()=>{if(audio.currentTime>3)audio.currentTime=0;else step(-1,false)};
$('#vib').onclick=()=>{
  haptics=!haptics;chips();if(tracks[cur])ui();
  if(haptics&&navigator.vibrate)navigator.vibrate(30);else stopV();
};
$('#sens').onclick=()=>{sens=(sens+1)%3;chips()};
$('#shuf').onclick=()=>{shuffle=!shuffle;chips()};
$('#rep').onclick=()=>{repeat=(repeat+1)%3;chips()};
$('#seek').oninput=e=>{if(audio.duration){audio.currentTime=e.target.value/1000*audio.duration;ct0=audio.currentTime;pf0=performance.now()}};
$('#addBtn').onclick=()=>$('#file').click();
$('#file').onchange=e=>{addFiles(e.target.files);e.target.value=''};
addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('drop')});
addEventListener('dragleave',()=>document.body.classList.remove('drop'));
addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('drop');addFiles(e.dataTransfer.files)});
addEventListener('keydown',e=>{
  if(e.target!==document.body)return;
  if(e.code==='Space'){e.preventDefault();toggle()}
  else if(e.code==='ArrowRight')audio.currentTime+=5;
  else if(e.code==='ArrowLeft')audio.currentTime-=5;
});
if('mediaSession' in navigator){
  const m=navigator.mediaSession;
  m.setActionHandler('play',()=>audio.play());m.setActionHandler('pause',()=>audio.pause());
  m.setActionHandler('previoustrack',()=>step(-1,false));m.setActionHandler('nexttrack',()=>step(1,false));
}

$('#artbox').onclick=()=>{if(cur<0)$('#file').click();else $('#imgFile').click()};
$('#artbox').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#artbox').click()}};
$('#imgFile').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';
  const t=tracks[cur];if(!f||!t)return;
  const url=URL.createObjectURL(f),cols=await colorsOf(url);
  if(!cols){URL.revokeObjectURL(url);say('Couldn’t read that image.');return}
  if(t.art)URL.revokeObjectURL(t.art);
  t.art=url;t.cols=cols;
  if(tracks[cur]===t)theme(t);
  ui();
};
$('#art').onerror=()=>{$('#art').hidden=true;$('#artbox').classList.remove('has')};

/* ---- snake-wave song time ---- */
let ct0=0,pf0=0,ph=0,lastF=0;
const cv=$('#wave'),cx=cv.getContext('2d'),still=matchMedia('(prefers-reduced-motion:reduce)').matches;
function wave(now){
  requestAnimationFrame(wave);
  const dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  if(!W||!H)return;
  if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
  const dt=Math.min(.05,(now-lastF)/1000||0);lastF=now;
  const playing=!audio.paused;
  if(playing&&!still)ph+=dt*8.5;
  const d=audio.duration||0,pos=d?Math.min(d,ct0+(playing?(performance.now()-pf0)/1000:0)):0;
  const pad=9,x1=pad+(W-2*pad)*(d?pos/d:0),cy=H/2;
  cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,W,H);
  cx.lineCap='round';cx.lineJoin='round';
  cx.strokeStyle='rgba(255,255,255,.3)';cx.lineWidth=3;
  cx.beginPath();cx.moveTo(x1,cy);cx.lineTo(W-pad,cy);cx.stroke();
  const k=2*Math.PI/30;
  cx.strokeStyle='#fff';cx.lineWidth=3.5;cx.beginPath();cx.moveTo(pad,cy);
  for(let x=pad+2;x<x1;x+=2){
    const env=Math.min(1,(x-pad)/14,(x1-x)/12);
    cx.lineTo(x,cy+4.5*env*Math.sin(k*x-ph));
  }
  cx.lineTo(x1,cy);cx.stroke();
  cx.fillStyle='#fff';cx.shadowColor='rgba(0,0,0,.45)';cx.shadowBlur=8;
  cx.beginPath();cx.arc(x1,cy,7,0,Math.PI*2);cx.fill();cx.shadowBlur=0;
}
requestAnimationFrame(wave);

/* ---- liquid-glass touch response ---- */
function glow(g,e){const r=g.getBoundingClientRect();g.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%');g.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%')}
addEventListener('pointerdown',e=>{const g=e.target.closest('.btn');if(!g)return;glow(g,e);g.classList.add('touch')});
addEventListener('pointermove',e=>{const g=document.querySelector('.btn.touch');if(g)glow(g,e)});
['pointerup','pointercancel','pointerleave'].forEach(n=>addEventListener(n,()=>document.querySelectorAll('.btn.touch').forEach(g=>g.classList.remove('touch'))));

function lockPortrait(){try{const r=screen.orientation.lock('portrait');if(r&&r.catch)r.catch(()=>{})}catch(e){}}
lockPortrait();addEventListener('click',lockPortrait,{once:true});
if(document.fonts)document.fonts.ready.then(()=>{lastTitle='';ui()});
addEventListener('resize',()=>{lastTitle='';ui()});
if(!navigator.vibrate){haptics=false;$('#vib').disabled=true;say('This browser can\u2019t vibrate (iPhones don\u2019t allow it). Music still plays.')}
theme(null);chips();ui();prog();
</script>
</body>
</html>
