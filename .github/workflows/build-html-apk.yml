name: Build Crack APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HTML files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Cordova App & Build APK
        run: |
          npm install -g cordova
          mkdir temp_html
          cp index.html temp_html/
          cordova create CrackApp com.shadow.crack "Crack"
          rm -rf CrackApp/www/*
          cp temp_html/index.html CrackApp/www/
          cd CrackApp
          cordova platform add android
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Crack-APK
          path: CrackApp/platforms/android/app/build/outputs/apk/debug/*.apk
